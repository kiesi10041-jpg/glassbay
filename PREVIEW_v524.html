<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v5.24 이미지 확인</title><link rel="stylesheet" href="style.css"><style>html,body{overflow:auto;height:auto;min-height:100%}main.review{position:relative;max-width:900px;margin:auto;padding:24px 18px 100px}.review .actions{max-width:650px}.review h1{font-size:24px}.review p{line-height:1.8}.review .itemArt{width:110px;height:110px}.review .grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.review .item{background:#233039;padding:12px}.review .choiceTexture{display:block}.review button{position:relative;overflow:hidden;min-height:74px}.review input{width:220px}</style><body class="choiceAtlasReady inventoryAtlasReady"><main class="review"><h1>선택지·아이템 이미지 확인</h1><p>실제 게임과 분리된 이미지 확인 페이지입니다. 선택지 가운데의 문구는 이미지 위에 유지됩니다.</p><label>침식 <input id="exposure" type="range" min="0" max="100" value="80"><b id="value">80</b></label><div class="actions"><button><span class="actionText">단말기에 지금 본 내용을 묻는다</span><span class="choiceTexture texture-0 textureTaking" style="--choice-opacity:.75" aria-hidden="true"></span></button><button><span class="actionText">다가오는 손을 피해 물러난다</span><span class="choiceTexture texture-1 textureTaking" style="--choice-opacity:.75" aria-hidden="true"></span></button><button><span class="actionText">찢긴 천 아래의 길을 살핀다</span><span class="choiceTexture texture-2 textureTaking" style="--choice-opacity:.75" aria-hidden="true"></span></button><button><span class="actionText">처음 남긴 기록과 지금을 대조한다</span><span class="choiceTexture texture-3 textureTaking" style="--choice-opacity:.75" aria-hidden="true"></span></button></div><h2>지닌 물품 10종</h2><div class="grid"><div class="item"><span class="itemArt"><span class="propAtlas" style="display:block;background-position:0% 0.0%"></span></span><b>구급상자</b></div><div class="item"><span class="itemArt"><span class="propAtlas" style="display:block;background-position:50% 0.0%"></span></span><b>차폐 필터</b></div><div class="item"><span class="itemArt"><span class="propAtlas" style="display:block;background-position:100% 0.0%"></span></span><b>식량</b></div><div class="item"><span class="itemArt"><span class="propAtlas" style="display:block;background-position:0% 33.333333333333336%"></span></span><b>예비 배터리</b></div><div class="item"><span class="itemArt"><span class="propAtlas" style="display:block;background-position:50% 33.333333333333336%"></span></span><b>밧줄</b></div><div class="item"><span class="itemArt"><span class="propAtlas" style="display:block;background-position:100% 33.333333333333336%"></span></span><b>연료</b></div><div class="item"><span class="itemArt"><span class="propAtlas" style="display:block;background-position:0% 66.66666666666667%"></span></span><b>배수문 열쇠</b></div><div class="item"><span class="itemArt"><span class="propAtlas" style="display:block;background-position:50% 66.66666666666667%"></span></span><b>점검차 열쇠</b></div><div class="item"><span class="itemArt"><span class="propAtlas" style="display:block;background-position:100% 66.66666666666667%"></span></span><b>반사판</b></div><div class="item"><span class="itemArt"><span class="propAtlas" style="display:block;background-position:0% 100.0%"></span></span><b>관리소 열쇠</b></div></div><p>이 페이지는 게임 진행을 저장하지 않습니다. 게임은 index.html에서 시작합니다.</p></main><script>document.getElementById('exposure').oninput=function(){document.getElementById('value').textContent=this.value;document.querySelectorAll('.choiceTexture').forEach(x=>x.style.setProperty('--choice-opacity',Number(this.value)/100))};</script></body></html>
